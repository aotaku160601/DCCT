# 共通設定（02_基本設計書 5節 / 8節、01_要件定義書 NFR-5 対応）
# 環境依存の値はすべてここに外出しし、コードにハードコードしない。

project:
  name: dcct-reproduction
  # 全実験で共通の乱数シード（データ分割・モデル初期化・パッチサンプリングに適用）
  seed: 42

paths:
  # 外部SSD「Extreme Pro」のマウントポイント。パスに空白を含むため必ずクォートすること。
  # 生成器のZIP／フォルダ（genimage-*.zip, BigGAN/ など）が直接置かれている階層を指す。
  # 実際のマウント名は `ls /Volumes` で確認すること（同名ディスクがあると
  # "Extreme Pro 1" のように連番が付く）。
  dataset_root: "/Volumes/Extreme Pro"
  # ZIP展開先。現在はZIPを展開せず直読みする方針のため未使用（README「ZIPは展開しない」参照）。
  # 将来展開方式に切り替える場合の置き場所として残している。
  extract_root: "/Volumes/Extreme Pro/GenImage_extracted"
  db_path: "db/dcct_metadata.sqlite3"
  checkpoint_root: "checkpoints"
  log_root: "logs"
  report_root: "reports"

device:
  # auto = cuda -> mps -> cpu の順に自動選択（03_詳細設計書 7.5、02_基本設計書 9節）
  # 明示指定する場合は cuda / mps / cpu を直接書く。torch.cuda.* には依存しない実装とする。
  type: auto
  # MPS未対応演算をCPUへ自動フォールバックさせる（macOS実行時のみ意味を持つ）
  enable_mps_fallback: true

dataset:
  name: GenImage
  # 【OI-1】Midjourneyは未取得のため、当面すべての学習・評価から除外する。
  # データ取得後はこのリストを空にするだけで8生成器のTable1再現に復帰できる。
  excluded_generators:
    - Midjourney
  # 学習に用いる生成器（論文プロトコル：SDv1.4のみで学習）
  train_generators:
    - SDv1.4
  # cross-generator評価対象（excluded_generators に含まれるものは自動でスキップ）
  eval_generators:
    - Midjourney
    - SDv1.4
    - SDv1.5
    - ADM
    - GLIDE
    - Wukong
    - VQDM
    - BigGAN


  # ---- ingest（データ取り込み）設定 ----
  # dataset_root からの相対パス。ZIPでもディレクトリでも同じインタフェースで走査する。
  # type: auto（拡張子から判定） | zip | dir
  sources:
    - { name: SDv1.4, path: "genimage-stable-diffusion-v1-4.zip", category: diffusion, type: auto }
    - { name: SDv1.5, path: "stable_diffusion_v_1_5",             category: diffusion, type: auto }
    - { name: ADM,    path: "genimage-adm.zip",                   category: diffusion, type: auto }
    - { name: Wukong, path: "genimage-wukong.zip",                category: diffusion, type: auto }
    - { name: GLIDE,  path: "imagenet_glide",                     category: diffusion, type: auto }
    - { name: VQDM,   path: "VQDM",                               category: diffusion, type: auto }
    - { name: BigGAN, path: "BigGAN",                             category: gan,       type: auto }
    # 【OI-1】未取得。path は判明後に設定する（excluded_generators に入っている間は走査しない）
    - { name: Midjourney, path: "",                               category: diffusion, type: auto }

  # nature/（実写ImageNet画像）をどの generator に紐づけるか
  #   per_source: 生成器ごとに 'ImageNet(real)@<生成器名>' を作る（既定）
  #               → cross-generator評価で「その生成器に対応する実写セット」を一意に引ける
  #   shared:     全生成器の nature/ をまとめて単一の 'ImageNet(real)' に紐づける
  real_generator_naming: per_source

  # GenImageは train/ と val/ しか持たないため、DBの split へ以下のように割り当てる
  split:
    # GenImage の val/ を test split として登録する（Table 1評価に使う）
    source_val_as: test
    # train/ から切り出して val split に回す比率（閾値τのチューニング・チェックポイント選択用）
    # 割当は seed とファイルパスのハッシュで決まるため、再実行しても同じ結果になる
    val_ratio_from_train: 0.05

  # ディレクトリ名の別名（GenImageの配布物により表記ゆれがあるため）
  directory_aliases:
    ai: [ai, fake, sdv4, imagenet_ai]
    real: [nature, real, imagenet_real]
    train: [train]
    val: [val, validation]
preprocess:
  # 03_詳細設計書 1.1 パラメータ一覧
  patch_size: 64            # s
  num_highpass_filters: 30  # M
  truncation_t: 7           # t
  use_cfa_mask: true        # Ablation-B で false に切替（ランダムRGB選択マスクになる）
  use_high_pass: true       # Ablation-B で false に切替（素通し）
  bayer_pattern: RGGB       # RGGB / BGGR / GRBG / GBRG
  # SRMと同じく残差を丸めてから[-t,t]にクリップし、{-t,...,t}の離散値にする。
  # 条件付きモデルの尤度を離散化ロジスティック混合（PixelCNN++）で書くための前提。
  quantize_residual: true

augmentation:
  # FR-10: 学習時のベナイン摂動
  jpeg:
    enabled: true
    probability: 0.05
    quality_min: 70
    quality_max: 100

model:
  conditional_unet:
    num_mixtures: 10        # K
    base_channels: 64
    # 予測対象 y' の作り方（03_詳細設計書の 1.2 と 3.3/3.4 で記述が食い違うため設定化）
    #   single_filter: 1種類のカーネルのみ y に適用し 2ch を保つ（既定。3.3/3.4と整合）
    #   filter_bank:   30種すべてを y に適用し 60ch とする（1.2の記述どおり）
    #                  この場合 classifier.feature_source は bottleneck にする必要がある
    target_mode: single_filter
    target_filter: square5x5
  classifier:
    resnet_blocks: 4
    transformer_layers: 2
    # 【OI-2 決定事項】gψへの入力特徴は案A（U-Net最終出力の混合分布パラメータ）を採用。
    # チャンネル数は 03_詳細設計書 3.3 の定義（w,μ,s 各 [K,2,H,W]）に従い
    # 3 * K * 2 = 60ch / モデル、pθ・qφ連結で 120ch とする。
    # （1.3節の「3K=30ch」表記はμ,sの2ch分を数え落としたものとして扱う。README参照）
    feature_source: mixture_params   # mixture_params | bottleneck（案B）

train:
  optimizer: adam
  learning_rate: 1.0e-4
  batch_size: 16
  num_workers: 4
  num_epochs: 20
  save_every_epoch: 1
  resume_from: null
  # NLL損失の集約方法。mean(既定) / sum / sum_per_sample
  nll_reduction: mean
  # 1エポックあたりのステップ数上限（null = 制限なし）。スモークテストや時間見積りに使う
  max_steps_per_epoch: null
  # 検証時のステップ数上限（null = val split全体）
  max_eval_steps: null

data:
  # 1回の学習で使う画像枚数の上限（null = 全件）。Apple Siliconでの学習時間に応じて調整する
  max_images: null

inference:
  num_patches: 16           # P
  threshold: 0.5            # τ の初期値。val上でYouden指数最大化によりチューニングする

evaluate:
  # 評価に使う分類器チェックポイント（--run-id を指定した場合はDBから自動解決される）
  classifier_checkpoint: null
  # val split上でYouden指数を最大化する閾値τを求めてから評価する（03_詳細設計書 7.3）
  tune_threshold: true
  # 1生成器あたりの評価枚数上限（null = 全件）
  max_images_per_generator: null
  robustness:
    # Figure 6相当。JPEG品質係数と空間ダウンサンプリング倍率
    jpeg_qualities: [100, 90, 80, 70]
    downsample_ratios: [0.9, 0.8, 0.7, 0.6]
